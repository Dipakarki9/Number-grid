<!DOCTYPE html>
<html lang="en">
<head>

    <title>Table</title>
    <link rel="stylesheet" href="tabling.css">
</head>
<body>
    <section class="price">
<h1>Our pricing plans</h1>
<div class="box">
<div class="card"> 
    <h2>Basic</h2>
    <p class="month">$10/month</p>
    <ul>
        <li>5 Projects</li>
        <li>Email Support</li>
        <li>Basic Access</li>
    </ul>
    <button>choose plan</button>
</div>
<div class="card"> 
<h2>Standard</h2>
<p class="month">$25/month</p>
<ul>
    <li>20 Projects</li>
    <li>Priority Support</li>
    <li>Full Access</li>
</ul>
<button>choose plan</button>
</div>
<div class="card">
    <h2>Premium</h2>
    <p class="month">$50/month</p>
    <ul>
        <li>Unlimited Projects</li>
        <li>24/7 Support</li>
        <li>All features</li>
    </ul>
    <button>choose plan</button>
</div>


</div>
    </section>

</html>
